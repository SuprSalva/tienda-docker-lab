name: Despliegue Kubernetes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a desplegar"
        required: true
        default: "1.0.0"

permissions:
  contents: read

env:
  IMAGEN_GHCR: ghcr.io/suprsalva/tienda-docker-lab
  CLUSTER: devops-clase

jobs:
  deploy-staging:
    runs-on: [self-hosted, Windows, X64]
    environment: staging

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar imagen Docker
        shell: powershell
        run: |
          docker pull "${{ env.IMAGEN_GHCR }}:${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar imagen para kind
        shell: powershell
        run: |
          docker tag "${{ env.IMAGEN_GHCR }}:${{ inputs.version }}" "tienda-api:${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kind load docker-image "tienda-api:${{ inputs.version }}" --name $env:CLUSTER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Desplegar en staging
        shell: powershell
        run: |
          kubectl config use-context "kind-$env:CLUSTER"
          kubectl apply -n staging -f k8s/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl set image deployment/tienda-api tienda="tienda-api:${{ inputs.version }}" -n staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verificar despliegue
        shell: powershell
        run: |
          kubectl rollout status deployment/tienda-api -n staging --timeout=120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl get pods,deployments,services -n staging
